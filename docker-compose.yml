services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_MAPBOX_TOKEN: "${NEXT_PUBLIC_MAPBOX_TOKEN:?Set NEXT_PUBLIC_MAPBOX_TOKEN before building}"
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-https://skersapi.schlarbys.com}"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
    restart: unless-stopped
